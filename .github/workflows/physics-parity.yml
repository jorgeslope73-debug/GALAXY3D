jobs:
  online-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check protocol syntax
        run: node --check server/net-protocol.js && node --check docs/net-protocol.js && node --check tools/check-online-protocol.js
      - name: Check online protocol and delivery
        run: node tools/check-online-protocol.js
      - name: Check session and control regressions
        run: node tools/check-session-regressions.js
      - name: Check host continuity and stale recovery replies
        run: node tools/check-host-continuity.js
      - name: Check compact packets and negotiated compatibility
        run: node tools/check-state-codec.js
      - name: Check compensated shots and immediate visual feedback
        run: node tools/check-shot-feedback.js
      - name: Check prediction and compact states through the unchanged relay
        run: node tools/check-relay-prediction.js
      - name: Check bounded online host client transport and comparable response
        run: node tools/check-host-client.js && node tools/check-host-client-integration.js
      - name: Check controller mapping and transported actions
        run: node tools/check-joystick-controls.js
  shared-physics-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check runtime syntax
        run: node --check docs/p2p-network.js && node --check docs/menu-loader.js && node --check docs/game.js && node --check docs/pwa.js && node --check docs/build-version.js && node --check docs/sw.js && node --check server/p2p-server.js && node --check tools/check-game-invariants.js && node --check tools/stress-game.js
      - name: Check host/local shared physics parity
        run: node tools/check-physics-parity.js
      - name: Check conservative collision filters against exact profiles
        run: node tools/check-physics-hot-paths.js
      - name: Check local motion and guest projectile prediction
        run: node tools/check-motion-prediction.js
      - name: Check host presentation and unchanged state cadence
        run: node tools/check-host-presentation-cadence.js
      - name: Check online hazards appear naturally during normal rounds
        run: node tools/check-online-hazards.js
      - name: Check meteor shower drains across phase and cycle changes
        run: node tools/check-shower-lifecycle.js
      - name: Check jittered remote playback clock
        run: node tools/check-network-playback.js
      - name: Check guest shot contact with visible surfaces
        run: node tools/check-shot-occlusion.js
      - name: Check authoritative and visual state integration
        run: node tools/check-online-presentation.js
      - name: Check rock collisions in local and host engines
        run: node tools/check-rock-collisions.js
      - name: Check medium rock size variants, contacts and wire parity
        run: node tools/check-medium-sizes.js
      - name: Check asteroid retirement preserves motion without phantom rebounds
        run: node tools/check-asteroid-exit.js
      - name: Check physical rock sweeps without depenetration jumps
        run: node tools/check-rock-correction-sweeps.js
      - name: Check CPU contact presentation at 30, 60 and 120 Hz
        run: node tools/check-local-contact-presentation.js
      - name: Check shield perimeter, projectiles and ramming in both engines
        run: node tools/check-shield-collisions.js
      - name: Check nose, wing and engine ship ramming contacts
        run: node tools/check-ship-ram-collisions.js
      - name: Check projectile collisions against the real ship silhouette
        run: node tools/check-ship-projectile-collisions.js
      - name: Check 3D presentation syntax
        run: node --check docs/render-3d.js && node --check docs/ship-model.js && node --check docs/rocket-model.js && node --check docs/meteor-model.js && node --check docs/menu-decor.js && node --check docs/winner-preview.js
      - name: Check bounded local green projectile lights
        run: node tools/check-projectile-lighting.mjs
      - name: Check ship GLB orientation and embedded resources
        run: node tools/check-ship-model.mjs
      - name: Check local visual ship pitch and damped throttle inertia
        run: node tools/check-ship-inertia.mjs
      - name: Check rocket GLB orientation, roll axis and shared geometry
        run: node tools/check-rocket-model.mjs
      - name: Check meteor GLB resources, scale and shared geometry
        run: node tools/check-meteor-model.mjs
      - name: Check irregular giant mesh outline and continuous contacts
        run: node tools/check-giant-outline.mjs
      - name: Check irregular medium outline and rock shape contacts
        run: node tools/check-medium-outline.mjs
      - name: Check rotating GLB profiles, banked hulls and authority packets
        run: node tools/check-rotating-profiles.mjs
      - name: Check UFO GLB resources, orientation, size and animation
        run: node tools/check-ufo-model.mjs
      - name: Check CPU mothership, turret muzzle calibration and irregular contacts
        run: node tools/check-mothership.mjs
      - name: Check decorative menu UFO timing and clearance
        run: node tools/check-menu-ufo.mjs
      - name: Check network resilience
        run: node tools/check-network-resilience.js
      - name: Check scoring and spawn behaviour
        run: node tools/check-spawn-scoring.js
      - name: Check session and control regressions
        run: node tools/check-session-regressions.js
      - name: Check complete graphics startup
        run: node tools/check-startup-graphics.js
      - name: Check edited model textures and offline cache
        run: node tools/check-model-texture-cache.js
      - name: Check local engine particle density, blue lifecycle and pool limits
        run: node tools/check-engine-particles.js
      - name: Check reserved respawn points, three-second delay and private countdown
        run: node tools/check-respawn-countdown.js
      - name: Check readiness phases and private first-spawn countdown
        run: node tools/check-start-preparation.js
      - name: Check shader and GPU prewarming before match readiness
        run: node tools/check-graphics-prewarm.js
      - name: Check resource loading, idle cache maintenance and visual fallbacks
        run: node tools/check-3d-only-assets.js && node tools/check-menu-resources.js && node tools/check-winner-preview.js && node tools/check-menu-art.js && node tools/check-game-resources.js && node tools/check-resource-cache.js && node tools/check-pwa-resource-idle.js
      - name: Check existing gameplay invariants
        run: node tools/check-game-invariants.js
      - name: Run 5-minute simulated gameplay stress
        env:
          STRESS_SECONDS: 300
        run: node tools/stress-game.js
