<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Combat · Estadísticas</title>
<style>
:root{color-scheme:dark;--bg:#070914;--panel:#101526;--text:#eef5ff;--muted:#91a2bd;--line:#26324d;--cyan:#5ae1ff;--pink:#ff5ba6;--green:#61efa3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#15213c 0,#070914 42%,#04060c 100%);color:var(--text);font-family:Inter,Arial,sans-serif}main{max-width:1180px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}h1{margin:0;font-size:clamp(24px,4vw,42px)}
a,button{color:var(--text)}.back,.refresh{border:1px solid var(--line);background:#151c30;padding:10px 14px;border-radius:10px;text-decoration:none;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:20px 0}.card,.panel{background:rgba(16,21,38,.9);border:1px solid var(--line);border-radius:14px;padding:16px}.value{font-size:28px;font-weight:800}.panel{margin-top:14px}h2{margin:0 0 14px;font-size:18px}
.chart{height:290px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--line);padding:12px 4px 0;overflow:hidden}.day{flex:1;min-width:5px;display:flex;align-items:flex-end;gap:2px;height:100%}.bar{flex:1;border-radius:4px 4px 0 0;min-height:2px}.visits{background:var(--cyan)}.matches{background:var(--pink)}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #242d44;text-align:left}th{color:var(--muted)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.chart{height:220px}}
</style>
</head>
<body>
<main>
  <div class="top"><div><div class="label">Galaxy Combat</div><h1>Partidas y visitas</h1></div><div><button id="refresh" class="refresh">ACTUALIZAR</button> <a href="./" class="back">VOLVER AL JUEGO</a></div></div>
  <div class="grid">
    <div class="card"><div class="label">Visitas</div><div id="visits" class="value">—</div></div>
    <div class="card"><div class="label">Partidas totales</div><div id="matches" class="value">—</div></div>
    <div class="card"><div class="label">Partidas CPU</div><div id="cpuMatches" class="value">—</div></div>
    <div class="card"><div class="label">Partidas online</div><div id="onlineMatches" class="value">—</div></div>
    <div class="card"><div class="label">Ranked terminadas</div><div id="rankedCompleted" class="value">—</div></div>
  </div>
  <section class="panel"><h2>Últimos 30 días</h2><div id="chart" class="chart"></div><div class="legend"><span><i class="dot" style="background:var(--cyan)"></i>Visitas</span><span><i class="dot" style="background:var(--pink)"></i>Partidas</span></div></section>
  <section class="panel"><h2>Detalle diario</h2><div style="overflow:auto"><table><thead><tr><th>Día</th><th>Visitas</th><th>CPU</th><th>Online</th><th>Total partidas</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script>
const API='https://galaxy-combat-web.onrender.com';
async function load(){
  try{
    const r=await fetch(API+'/api/analytics',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw 0;
    const t=d.totals||{};visits.textContent=t.visits||0;matches.textContent=t.matches||0;cpuMatches.textContent=t.cpuMatches||0;onlineMatches.textContent=t.onlineMatches||0;rankedCompleted.textContent=t.rankedCompleted||0;
    const daily=Array.isArray(d.daily)?d.daily:[],max=Math.max(1,...daily.map(x=>Math.max(x.visits||0,(x.cpuMatches||0)+(x.onlineMatches||0))));
    chart.innerHTML=daily.map(x=>{const m=(x.cpuMatches||0)+(x.onlineMatches||0);return '<div class="day" title="'+x.day+' · '+(x.visits||0)+' visitas · '+m+' partidas"><div class="bar visits" style="height:'+(x.visits/max*100)+'%"></div><div class="bar matches" style="height:'+(m/max*100)+'%"></div></div>'}).join('');
    rows.innerHTML=[...daily].reverse().map(x=>{const m=(x.cpuMatches||0)+(x.onlineMatches||0);return '<tr><td>'+x.day+'</td><td>'+x.visits+'</td><td>'+x.cpuMatches+'</td><td>'+x.onlineMatches+'</td><td>'+m+'</td></tr>'}).join('');
  }catch(_){chart.innerHTML='<div style="color:#91a2bd">No se pudieron cargar las estadísticas. Si Render acaba de desplegar, espera unos segundos.</div>'}
}
refresh.addEventListener('click',load);load();
</script>
</body>
</html>
